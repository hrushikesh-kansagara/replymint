<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bbf7d0"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- Mint leaf shape -->
  <ellipse cx="64" cy="52" rx="22" ry="30" fill="url(#leaf)" transform="rotate(-15 64 52)" opacity="0.95"/>
  <ellipse cx="72" cy="58" rx="18" ry="26" fill="white" transform="rotate(10 72 58)" opacity="0.3"/>
  <!-- Stem -->
  <path d="M64 78 Q60 90 56 100" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Sparkle dots -->
  <circle cx="95" cy="35" r="4" fill="white" opacity="0.8"/>
  <circle cx="88" cy="25" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="100" cy="48" r="2" fill="white" opacity="0.5"/>
</svg>
